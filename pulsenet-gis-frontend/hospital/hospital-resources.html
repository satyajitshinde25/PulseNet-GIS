<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Resources - PulseNet-GIS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden">
  <aside class="w-64 bg-indigo-900 text-white border-r border-indigo-800 flex flex-col hidden md:flex shrink-0">
    <div class="h-16 flex items-center px-6 border-b border-indigo-800 bg-indigo-950">
      <span class="material-symbols-outlined text-blue-400 text-2xl mr-2">domain</span>
      <span class="text-xl font-bold tracking-tight">PulseNet-GIS</span>
    </div>
    <div class="p-4">
            <nav class="space-y-1">
        <a href="hospital-dashboard.html" data-nav="dashboard" class="flex items-center gap-3 px-3 py-2 rounded-md text-indigo-200 hover:bg-indigo-800 transition-colors">
          <span class="material-symbols-outlined">dashboard</span> Dashboard
        </a>
        <a href="hospital-referrals.html" data-nav="referrals" class="flex items-center gap-3 px-3 py-2 rounded-md text-indigo-200 hover:bg-indigo-800 transition-colors">
          <span class="material-symbols-outlined">move_to_inbox</span> Incoming Referrals
        </a>
        <a href="hospital-resources.html" data-nav="resources" class="flex items-center gap-3 px-3 py-2 rounded-md bg-indigo-800 text-white font-semibold transition-colors">
          <span class="material-symbols-outlined">inventory_2</span> Live Resources
        </a>
        <a href="hospital-reservations.html" data-nav="reservations" class="flex items-center gap-3 px-3 py-2 rounded-md text-indigo-200 hover:bg-indigo-800 transition-colors">
          <span class="material-symbols-outlined">book_online</span> Reservations
        </a>
        <a href="hospital-history.html" data-nav="history" class="flex items-center gap-3 px-3 py-2 rounded-md text-indigo-200 hover:bg-indigo-800 transition-colors">
          <span class="material-symbols-outlined">history</span> History
        </a>
      </nav>
    </div>
  </aside>
  <main class="flex-1 flex flex-col overflow-hidden relative">
    <header class="md:hidden h-16 bg-indigo-900 text-white flex items-center px-4 shrink-0 gap-4">
      <a href="hospital-dashboard.html" class="text-indigo-200 hover:text-white">
        <span class="material-symbols-outlined">arrow_back</span>
      </a>
      <span class="font-bold">Live Resources</span>
    </header>

    <div class="flex-1 overflow-y-auto p-6 md:p-8 bg-gray-50">
      <h1 class="text-2xl font-bold text-gray-800 mb-6">Inventory Management</h1>
      
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Resource</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Reserved</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Available</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200" id="hospital-resources-list">
            <tr><td colspan="4" class="p-8 text-center text-gray-500">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  
  <script src="../js/app.js?v=3"></script>
  <script src="../js/auth.js?v=3"></script>
  <script src="../js/api.js?v=3"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = Auth.requireRole(['HOSPITAL']);
      if(user) {
        const invRes = await API.getHospitalInventory(user.hospitalId);
        
        const listEl = document.getElementById('hospital-resources-list');
        
        if (!invRes.success) {
          listEl.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-gray-500">Inventory not found.</td></tr>`;
          return;
        }
        
        const inv = invRes.data;
        const toCard = (key, title, avail) => {
          const total = (avail || 0) + 5; 
          const reserved = 5;
          return { key, name: title, data: { total, reserved, available: avail || 0 } };
        };
        
        const resources = [
          toCard('icu', 'ICU Beds', inv.icu),
          toCard('ventilator', 'Ventilators', inv.ventilator),
          toCard('general', 'General Beds', inv.general),
          toCard('blood', 'Blood Units', inv.blood)
        ];
        
        listEl.innerHTML = resources.map(r => `
          <tr>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${r.name}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${r.data.total}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-orange-600 font-medium">${r.data.reserved}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-blue-600 font-bold flex items-center gap-3">
              <button onclick="updateInventory('${r.key}', -1)" class="w-6 h-6 flex items-center justify-center bg-gray-200 hover:bg-red-200 text-gray-700 rounded transition-colors">-</button>
              <span class="w-4 text-center">${r.data.available}</span>
              <button onclick="updateInventory('${r.key}', 1)" class="w-6 h-6 flex items-center justify-center bg-gray-200 hover:bg-green-200 text-gray-700 rounded transition-colors">+</button>
            </td>
          </tr>
        `).join('');
      }
    });

    window.updateInventory = async (key, delta) => {
      const user = Auth.requireRole(['HOSPITAL']);
      if (!user) return;
      
      // Get current inventory to calculate new value
      const invRes = await API.getHospitalInventory(user.hospitalId);
      if (invRes.success) {
          const currentVal = invRes.data[key] || 0;
          const newVal = Math.max(0, currentVal + delta);
          await API.updateHospitalInventory(user.hospitalId, { [key]: newVal });
          window.location.reload();
      }
    };
  </script>
</body>
</html>
