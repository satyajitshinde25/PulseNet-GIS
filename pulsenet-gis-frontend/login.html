<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PulseNet-GIS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center p-4">
  
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden">
    <div class="bg-blue-900 p-6 text-center">
      <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-4">
        <span class="material-symbols-outlined text-blue-900 text-3xl">medical_services</span>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-wide">PULSENET-GIS</h1>
      <p class="text-blue-200 text-sm mt-2">Real-Time PHC Referral & Hospital Resource Coordination Platform</p>
    </div>
    
    <div class="p-8">
      <h2 class="text-xl font-semibold mb-6 text-gray-800 text-center">Prototype Demo Login</h2>
      
      <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
          <input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Enter demo email">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Enter password (demo123)">
        </div>
        
        <div id="login-error" class="text-red-500 text-sm hidden bg-red-50 p-2 rounded">
          Invalid credentials. Please try again.
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-colors mt-4">
          Sign In
        </button>
      </form>

      <div class="mt-8 text-center flex flex-col gap-2">
        <p class="text-xs text-gray-500">
          PulseNet-GIS Platform.<br/>Authorized access only.
        </p>
      </div>
    </div>
  </div>

  <script src="js/mock-data.js?v=3"></script>
  <script src="js/auth.js?v=3"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('login-error');
      
      const role = Auth.login(email, password);
      if (role) {
        errorDiv.classList.add('hidden');
        if (role === 'PHC_DOCTOR') window.location.replace('/phc/phc-dashboard.html');
        else if (role === 'HOSPITAL_MANAGER') window.location.replace('/hospital/hospital-dashboard.html');
        else if (role === 'AMBULANCE_DRIVER') window.location.replace('/ambulance/ambulance-dashboard.html');
      } else {
        errorDiv.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
