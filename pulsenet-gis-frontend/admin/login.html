<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - PulseNet-GIS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .card {
      width: 100%; max-width: 420px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }
    .header {
      background: linear-gradient(135deg, #1e40af, #1d4ed8);
      padding: 36px 32px;
      text-align: center;
      position: relative;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.15);
      color: #bfdbfe; font-size: 11px; font-weight: 600;
      padding: 4px 12px; border-radius: 20px; margin-bottom: 16px;
      letter-spacing: .5px; text-transform: uppercase;
    }
    .header h1 { color: white; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .header p { color: #93c5fd; font-size: 13px; margin-top: 6px; }
    .shield { font-size: 40px; margin-bottom: 12px; }
    .body { padding: 32px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #94a3b8; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; color: white; font-size: 14px;
      transition: border .2s, box-shadow .2s;
    }
    input::placeholder { color: #475569; }
    input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.2); }
    .field { margin-bottom: 20px; }
    .error-box {
      background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3);
      color: #fca5a5; padding: 10px 14px; border-radius: 8px;
      font-size: 13px; margin-bottom: 16px; display: none;
    }
    button {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white; font-weight: 600; font-size: 15px;
      border: none; border-radius: 10px; cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    button:hover { opacity: .9; }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .footer { text-align: center; margin-top: 20px; }
    .footer a { color: #60a5fa; font-size: 12px; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="shield">🛡️</div>
    <div class="badge">🔒 Restricted Access</div>
    <h1>Admin Portal</h1>
    <p>PulseNet-GIS Administration</p>
  </div>
  <div class="body">
    <div id="err" class="error-box"></div>
    <form onsubmit="doLogin(event)">
      <div class="field">
        <label>Admin Email</label>
        <input type="email" id="email" required placeholder="admin@pulsenet.in" autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="pass" required placeholder="Enter admin password" autocomplete="current-password">
      </div>
      <button type="submit" id="btn">Sign In to Admin Panel</button>
    </form>
    <div class="footer" style="margin-top:16px">
      <a href="/login.html">Back to Main Portal</a>
    </div>
  </div>
</div>

<script>
  // Redirect if already logged in as admin
  const t = localStorage.getItem('admin_token');
  if (t) window.location.replace('/admin/dashboard.html');

  async function doLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const err = document.getElementById('err');
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Signing in...';
    try {
      const res = await fetch('/admin/api/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email: document.getElementById('email').value, password: document.getElementById('pass').value})
      });
      const data = await res.json();
      if (!res.ok) {
        err.textContent = data.detail || 'Login failed.';
        err.style.display = 'block';
      } else {
        localStorage.setItem('admin_token', data.access_token);
        localStorage.setItem('admin_user', JSON.stringify({name: data.name, role: data.role}));
        window.location.replace('/admin/dashboard.html');
      }
    } catch(ex) {
      err.textContent = 'Network error. Is the server running?';
      err.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = 'Sign In to Admin Panel';
  }
</script>
</body>
</html>
