<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History - PulseNet-GIS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden">
  
  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-gray-200 flex flex-col hidden md:flex shrink-0">
    <div class="h-16 flex items-center px-6 border-b border-gray-200">
      <span class="material-symbols-outlined text-blue-800 text-2xl mr-2">medical_services</span>
      <span class="text-xl font-bold text-blue-900 tracking-tight">PulseNet-GIS</span>
    </div>
    
    <div class="p-4">
      <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Primary Health Center</div>
      <div id="user-name-display" class="font-medium text-gray-800 mb-6 truncate">Dr. Name</div>
      
      <nav class="space-y-1">
        <a href="phc-dashboard.html" data-nav="dashboard" class="flex items-center gap-3 px-3 py-2 rounded-md text-gray-600 hover:bg-gray-50 transition-colors">
          <span class="material-symbols-outlined">dashboard</span>
          Dashboard
        </a>
        <a href="phc-referral.html" data-nav="referral" class="flex items-center gap-3 px-3 py-2 rounded-md text-gray-600 hover:bg-gray-50 transition-colors">
          <span class="material-symbols-outlined">add_circle</span>
          New Referral
        </a>
        <a href="phc-transfer.html" data-nav="transfer" class="flex items-center gap-3 px-3 py-2 rounded-md text-gray-600 hover:bg-gray-50 transition-colors">
          <span class="material-symbols-outlined">moving</span>
          Active Transfers
        </a>
        <a href="phc-history.html" data-nav="history" class="flex items-center gap-3 px-3 py-2 rounded-md bg-blue-50 text-blue-700 font-semibold transition-colors">
          <span class="material-symbols-outlined">history</span>
          History
        </a>
      </nav>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col overflow-hidden relative">
    <header class="md:hidden h-16 bg-white border-b border-gray-200 flex items-center px-4 shrink-0 gap-4">
      <a href="phc-dashboard.html" class="text-gray-500 hover:text-blue-600">
        <span class="material-symbols-outlined">arrow_back</span>
      </a>
      <span class="font-bold text-gray-800">History</span>
    </header>

    <div class="flex-1 overflow-y-auto p-6 md:p-8">
      <h1 class="text-2xl font-bold text-gray-800 mb-6">Referral History</h1>
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="divide-y divide-gray-200" id="history-list">
          <div class="p-8 text-center text-gray-500">Loading...</div>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/app.js?v=3"></script>
  <script src="../js/api.js?v=3"></script>
  <script src="../js/auth.js?v=3"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Auth.requireRole(['PHC_DOCTOR']);
      
      const res = await API.getAllReferrals();
      const referrals = res.success ? res.data : [];
      const completed = referrals.filter(r => r.status === 'COMPLETED' || r.status === 'CANCELLED');
      
      const listEl = document.getElementById('history-list');
      
      if (completed.length === 0) {
        listEl.innerHTML = `<div class="p-8 text-center text-gray-500">No completed referrals found.</div>`;
        return;
      }
      
      const sorted = completed.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
      
      listEl.innerHTML = sorted.map(r => `
        <div class="p-4 md:p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <h4 class="font-bold text-gray-900">${r.patientId}</h4>
            <div class="flex items-center gap-2 text-sm text-gray-500 mt-1">
              <span>Ref ID: ${r.id}</span>
              <span>&bull;</span>
              <span>${new Date(r.createdAt).toLocaleDateString()}</span>
            </div>
          </div>
          <div>
            <span class="px-3 py-1 rounded-full text-xs font-semibold ${r.status === 'COMPLETED' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-600'}">
              ${r.status}
            </span>
          </div>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
